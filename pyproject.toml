[project]
name = "foresight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aioodbc>=0.5.0",
  "aiosqlite>=0.22.1",
  "alembic>=1.16.5",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "email-validator>=2.3.0",
  "fastapi[standard]>=0.129.0",
  "passlib>=1.7.4",
  "pydantic-settings>=2.11.0",
  "pydantic>=2.11.9",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.3",
  "sqlalchemy-cockroachdb>=2.0.3",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "ipykernel>=7.2.0",
  "ipython>=9.5.0",
  "mypy>=1.18.2",
  "mypy-extensions>=1.1.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.4",
  "types-passlib>=1.7.7.20250602",
  "types-python-jose>=3.5.0.20250531",
  "types-pyyaml>=6.0.12.20260408",
]

# ------------------------------------------------------
# Mypy
# ------------------------------------------------------

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = false
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
warn_unused_configs = true
exclude = ["alembic/versions"]

# ------------------------------------------------------
# Ruff
# ------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: import sort
# W: warnings
# B: bugbear
# UP: pyupgrade
# N: naming
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = []

[tool.ruff.lint.pycodestyle]
max-line-length = 100

# ------------------------------------------------------
# Pyrefly (Meta Language Server)
# ------------------------------------------------------

[tool.pyrefly]
search_path = ["."]
python-version = "3.13"
preset = "default"
ignore-missing-imports = []

# ------------------------------------------------------
# Pytest
# ------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = "."
python_files = "tests.py tests_*.py *_tests.py test_*.py *_test.py"
addopts = "-v --import-mode=importlib"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
  "ignore:Cannot correctly sort tables:sqlalchemy.exc.SAWarning",
  "ignore:Accessing argon2.__version__:DeprecationWarning",
  "ignore:pandas only supports SQLAlchemy connectable:UserWarning",
  "ignore:The behavior of DataFrame concatenation:FutureWarning",
  "ignore::ResourceWarning",
]
